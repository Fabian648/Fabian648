<svg width="800" height="160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .title {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 30px;
        font-weight: 700;
        fill: #e6edf3;
        animation: fadeUp 1.2s ease forwards;
        opacity: 0;
      }
      .sub {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 13px;
        fill: #58a6ff;
        animation: fadeUp 1.2s ease 0.5s forwards;
        opacity: 0;
      }
      .cursor {
        fill: #58a6ff;
        animation: blink 1s step-end infinite;
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
        0%,100% { opacity:1; } 50% { opacity:0; }
      }

      /* Stars */
      .s { fill: #ffffff; animation: twinkle var(--d,3s) ease-in-out infinite alternate; }
      @keyframes twinkle {
        from { opacity: 0.1; } to { opacity: 0.9; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="160" class="bg" rx="10"/>

  <!-- Stars layer -->
  <circle class="s" cx="42"  cy="18"  r="1.2" style="--d:2.1s"/>
  <circle class="s" cx="120" cy="9"   r="0.8" style="--d:3.4s"/>
  <circle class="s" cx="200" cy="22"  r="1.5" style="--d:1.8s"/>
  <circle class="s" cx="310" cy="12"  r="0.9" style="--d:4.2s"/>
  <circle class="s" cx="400" cy="7"   r="1.1" style="--d:2.7s"/>
  <circle class="s" cx="490" cy="20"  r="0.7" style="--d:3.1s"/>
  <circle class="s" cx="580" cy="11"  r="1.3" style="--d:2.4s"/>
  <circle class="s" cx="660" cy="25"  r="0.9" style="--d:1.9s"/>
  <circle class="s" cx="740" cy="8"   r="1.4" style="--d:3.7s"/>
  <circle class="s" cx="770" cy="35"  r="0.6" style="--d:2.2s"/>
  <circle class="s" cx="70"  cy="50"  r="0.8" style="--d:4.5s"/>
  <circle class="s" cx="160" cy="45"  r="1.1" style="--d:2.9s"/>
  <circle class="s" cx="260" cy="55"  r="0.7" style="--d:3.3s"/>
  <circle class="s" cx="350" cy="40"  r="1.0" style="--d:1.7s"/>
  <circle class="s" cx="440" cy="52"  r="1.3" style="--d:4.0s"/>
  <circle class="s" cx="530" cy="42"  r="0.8" style="--d:2.6s"/>
  <circle class="s" cx="620" cy="58"  r="1.2" style="--d:3.5s"/>
  <circle class="s" cx="710" cy="47"  r="0.9" style="--d:1.6s"/>
  <circle class="s" cx="22"  cy="130" r="1.0" style="--d:3.8s"/>
  <circle class="s" cx="100" cy="140" r="0.7" style="--d:2.3s"/>
  <circle class="s" cx="180" cy="125" r="1.2" style="--d:4.1s"/>
  <circle class="s" cx="280" cy="145" r="0.8" style="--d:1.5s"/>
  <circle class="s" cx="370" cy="133" r="1.4" style="--d:3.0s"/>
  <circle class="s" cx="460" cy="148" r="0.6" style="--d:2.8s"/>
  <circle class="s" cx="550" cy="128" r="1.1" style="--d:4.3s"/>
  <circle class="s" cx="640" cy="142" r="0.9" style="--d:1.9s"/>
  <circle class="s" cx="730" cy="135" r="1.3" style="--d:3.6s"/>
  <circle class="s" cx="785" cy="150" r="0.7" style="--d:2.0s"/>

  <!-- Subtle horizontal rule -->
  <line x1="40" y1="110" x2="760" y2="110" stroke="#21262d" stroke-width="1"/>

  <!-- Text -->
  <text x="400" y="75" class="title" text-anchor="middle">Hi, I'm Fabian 👋</text>
  <text x="400" y="98" class="sub" text-anchor="middle">Java · Python · Clean Architecture · Building things that last.</text>
</svg>
